<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspector and stars visual preview</title>
    <style>
      html, body, #root { overflow: auto !important; height: auto !important; min-height: 100%; }
      body { padding: 24px; }
      .visual-fixture { max-width: 1280px; margin: auto; }
      .visual-fixture h1 { font-size: 22px; margin-bottom: 8px; }
      .visual-fixture > p { max-width: 900px; font-size: 13px; line-height: 1.6; color: #a5b4c8; }
      .visual-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 18px 0; }
      .visual-controls button { border: 1px solid #35475d; border-radius: 8px; padding: 8px 12px; color: #e1e7ef; background: #1a2331; }
      .visual-controls button[aria-pressed='true'] { border-color: #a9d9ff; color: #a9d9ff; }
      .visual-preview { display: flex; gap: 32px; align-items: flex-start; }
      .visual-stars { flex: 1; min-width: 280px; padding-top: 8px; }
      .visual-stars h2 { font-size: 16px; margin-bottom: 8px; }
      .visual-stars p { font-size: 12px; color: #a5b4c8; line-height: 1.6; }
      .visual-star-canvas { height: 340px; margin-top: 12px; border: 1px solid #263347; border-radius: 12px; overflow: hidden; }
      .visual-star-magnitudes { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-size: 12px; color: #a5b4c8; margin-top: 8px; }
      .inspector-preview { flex-shrink: 0; max-width: 100%; }
      .inspector-preview .image-inspector { position: relative; inset: auto; width: 100%; height: 100%; max-height: none; }
      .visual-state { font-size: 12px; color: #a5b4c8; margin-top: 16px; }
      @media (max-width: 840px) {
        body { padding: 16px; }
        .visual-preview { flex-direction: column-reverse; gap: 24px; }
        .visual-stars { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./inspector-visual.jsx"></script>
  </body>
</html>
